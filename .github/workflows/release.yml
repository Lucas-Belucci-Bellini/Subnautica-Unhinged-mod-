name: Release

# Uma release por pacote. A tag diz qual:
#   core-v0.1.0  ·  scannerroom-v0.1.0  ·  alterrahub-v1.0.3
#
# Existe porque as releases precisam sair do GitHub, e nao da maquina de quem
# desenvolve: o build fica reproduzivel e ninguem precisa ter as refs locais.
on:
  push:
    # Uma tag por MOD. `fcs-*` e a convencao a partir de agora; `alterrahub-*`
    # fica aceita so para nao quebrar as duas tags ja publicadas.
    tags: ['core-v*', 'scannerroom-v*', 'fcs-v*', 'alterrahub-v*']
  workflow_dispatch:
    inputs:
      pacote:
        description: 'Qual pacote'
        required: true
        default: alterrahub
        type: choice
        options: [core, scannerroom, alterrahub]
      publicar:
        description: 'Publicar a release (a tag e criada a partir da versao do pacote)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write   # necessario para criar a release

env:
  # Versao do Nautilus que este projeto tem como alvo. Fica aqui em cima porque
  # e o unico numero de terceiro que o build precisa acertar — quando subir, sobe
  # nesta linha, e nao no meio de um `gh release download`.
  NAUTILUS_TAG: '1.0.0-pre.53'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Descobrir o pacote a partir da tag
        id: alvo
        run: |
          set -euo pipefail
          # A versao mora numa fonte so — o csproj / UnhingedInfo do pacote — para a
          # tag nunca discordar do que esta dentro do ZIP.
          versao_de() {
            case "$1" in
              core)        grep -oP '(?<=Version = ")[^"]+' src/Unhinged.Core/UnhingedInfo.cs ;;
              scannerroom) grep -oP '(?<=<Version>)[^<]+' src/mods/ScannerRoom/ScannerRoom.csproj ;;
              alterrahub)  grep -oP '(?<=<Version>)[^<]+' src/mods/AlterraHub/AlterraHub.csproj ;;
            esac
          }

          # ⚠️ O prefixo da tag identifica o MOD, nao o pacote interno: quem ve
          # `fcs-v1.1.0` numa lista sabe o que vem dentro. `alterrahub` era nome
          # de pasta vazando para o publico.
          prefixo_de() {
            case "$1" in
              core)        echo "core" ;;
              scannerroom) echo "scannerroom" ;;
              alterrahub)  echo "fcs" ;;
            esac
          }
          titulo_de() {
            case "$1" in
              core)        echo "Subnautica Unhinged — Core v$2" ;;
              scannerroom) echo "Sala de Scanner v$2" ;;
              alterrahub)  echo "FC Studios Modernized v$2" ;;
            esac
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pacote="${{ inputs.pacote }}"
            v="$(versao_de "$pacote")"
            tag="$(prefixo_de "$pacote")-v$v"
            echo "titulo=$(titulo_de "$pacote" "$v")" >> "$GITHUB_OUTPUT"
            echo "pacote=$pacote" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            [ "${{ inputs.publicar }}" = "true" ] \
              && echo "publicar=sim" >> "$GITHUB_OUTPUT" \
              || echo "publicar=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            core-v*)        p=core ;;
            scannerroom-v*) p=scannerroom ;;
            fcs-v*|alterrahub-v*) p=alterrahub ;;
            *) echo "::error::Tag '$tag' nao corresponde a nenhum pacote."; exit 1 ;;
          esac
          echo "pacote=$p" >> "$GITHUB_OUTPUT"
          echo "titulo=$(titulo_de "$p" "$(versao_de "$p")")" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publicar=sim" >> "$GITHUB_OUTPUT"

      # Estas DLLs sao de terceiros e por isso NAO ficam no repositorio. Sao baixadas
      # aqui so como referencia de COMPILACAO — nenhuma entra nos ZIPs publicados
      # (o empacotar.sh recusa o build se alguma aparecer no pacote).
      - name: Baixar as referencias de compilacao
        run: |
          set -euo pipefail
          mkdir -p refs

          echo "→ Nautilus (GPL-3.0, SubnauticaModding)"
          mkdir -p /tmp/nautilus/x

          # ⚠️ A TAG E OBRIGATORIA. TODO release 1.x do Nautilus e marcado como
          # PRE-RELEASE, e `gh release ... latest` ignora pre-release: ele caia no
          # release antigo do SMLHelper 2.15 (o repositorio foi renomeado de
          # SMLHelper para Nautilus e o release velho continua la como o unico
          # "latest" estavel). Sem tag, o download nunca traria o Nautilus.
          # Esta e a mesma versao que o projeto tem como alvo.
          echo "assets de $NAUTILUS_TAG:"
          gh release view "$NAUTILUS_TAG" --repo SubnauticaModding/Nautilus \
            --json assets --jq '.assets[].name' || true
          gh release download "$NAUTILUS_TAG" --repo SubnauticaModding/Nautilus \
            --pattern '*' --dir /tmp/nautilus --clobber

          # O DLL pode vir solto ou dentro de um arquivo compactado.
          for arquivo in /tmp/nautilus/*.zip /tmp/nautilus/*.7z; do
            [ -e "$arquivo" ] && unzip -o -q "$arquivo" -d /tmp/nautilus/x || true
          done

          found=$(find /tmp/nautilus -name 'Nautilus.dll' | head -1)
          if [ -z "$found" ]; then
            echo "::error::Nautilus.dll nao encontrado em $NAUTILUS_TAG. Baixado:"
            find /tmp/nautilus -maxdepth 3 -type f -printf '  %p\n'
            exit 1
          fi
          cp "$found" refs/Nautilus.dll

          # MoreCyclopsUpgrades e NAudio: o proprio repositorio do FCS (MIT) os versiona.
          echo "→ MoreCyclopsUpgrades e NAudio (do repo do FCS)"
          base='https://raw.githubusercontent.com/ccgould/FCStudios_SubnauticaMods/4275d847de6e0f24c711b4b2a9f4308c10ea8248/Libs'
          curl -sSfL "$base/SN_Exp/MoreCyclopsUpgrades.dll" -o refs/MoreCyclopsUpgrades.dll
          curl -sSfL "$base/SN_Stable/NAudio.dll"           -o refs/NAudio.dll

          ls -la refs/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Empacotar
        run: |
          chmod +x build/empacotar.sh
          ./build/empacotar.sh "${{ steps.alvo.outputs.pacote }}"
          ls -la dist/*.zip

      # Compilar nao prova que um patch encontra o alvo: o Harmony resolve por NOME,
      # em runtime. Metodo renomeado numa atualizacao do jogo compila liso e derruba
      # o modulo inteiro no carregamento. Aqui isso vira erro de build.
      - name: Conferir os alvos de Harmony contra as assemblies do jogo
        if: steps.alvo.outputs.pacote == 'alterrahub'
        run: |
          set -euo pipefail
          dotnet build tools/VerificarPatches -c Release -v q --nologo
          ./tools/VerificarPatches/rodar.sh
          # Alvos que NAO tem atributo e por isso escapam da varredura acima:
          #  · os dois imperativos (AccessTools.Method/Field no QPatch e no Mod)
          #  · os quatro campos privados do Builder buscados por string com
          #    typeof(Builder).GetField("..."), que devolvem null em silencio e so
          #    estouram com NRE la na frente, longe da causa.
          MEMBROS="ConstructorInput::OnCraftingBegin,BaseBioReactor::charge,Builder::ghostModel,Builder::placeLayerMask,Builder::placeMaxDistance,Builder::rotationEnabled" ./tools/VerificarPatches/rodar.sh

          # Um interruptor de modulo que nao casa com namespace nenhum e pior que
          # interruptor nenhum: aparece no .cfg, o jogador desliga, e o modulo carrega
          # assim mesmo. A lista sai do proprio Plugin.cs, sem duplicar.
          chmod +x build/conferir-modulos.sh
          ./build/conferir-modulos.sh

      - name: Publicar a release
        if: steps.alvo.outputs.publicar == 'sim'
        run: |
          set -euo pipefail
          # O LEIA-ME do pacote e o corpo da release: uma fonte so, sem divergir.
          leiame=$(find dist -maxdepth 2 -name 'INSTALL.md' | head -1)
          tag='${{ steps.alvo.outputs.tag }}'

          # Corpo = nivel de verificacao + checksum + o LEIA-ME.
          #
          # ⚠️ O nivel de verificacao e a PRIMEIRA coisa da release, e diz a verdade:
          # este ambiente e Linux sem Subnautica, entao nada foi aberto no jogo. Uma
          # release que insinua teste que nao houve custa mais caro que uma que admite
          # o que falta.
          corpo=$(mktemp)
          {
            echo 'Esta release contem a versao modernizada dos sistemas'
            echo '**FC Studios** integrada ao **Subnautica Unhinged**.'
            echo
            echo '```text'
            grep -E '^(Integrated Mod|Source Repository|Source Branch|Source Commit|Modernization Branch|Integrated Commit|Subnautica Build|BepInEx|Nautilus):' \
              dist/BUILD-MANIFEST-*.txt || true
            echo '```'
            echo
            echo '## Nivel de verificacao'
            echo
            echo '**`Build verified`** — compila contra as assemblies reais da build 82304'
            echo 'e todo alvo de patch foi resolvido por metadata.'
            echo
            echo 'NAO foi testado em jogo (`In-game tested`) nem por testes automatizados'
            echo '(`Automated tests verified`): o ambiente de build e Linux, sem Subnautica.'
            echo 'Comportamento em jogo, compatibilidade de save, assinatura dos patches e'
            echo 'carregamento dos asset bundles seguem **sem verificacao**.'
            echo
            echo '## SHA256'
            echo
            echo 'Confira com `sha256sum -c SHA256SUMS` (asset desta release).'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo '---'
            echo
            cat "$leiame"
          } > "$corpo"

          # Rodar de novo a mesma versao nao pode falhar o job: substitui os arquivos da
          # release existente em vez de estourar em "tag ja existe".
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/SHA256SUMS dist/BUILD-MANIFEST-*.txt dist/CHANGELOG.md dist/INSTALL.md --clobber
            # o corpo tambem muda: o checksum acompanha o ZIP novo
            gh release edit "$tag" --notes-file "$corpo"
          else
            gh release create "$tag" dist/*.zip dist/SHA256SUMS dist/BUILD-MANIFEST-*.txt dist/CHANGELOG.md dist/INSTALL.md \
              --target "${GITHUB_SHA}" \
              --title '${{ steps.alvo.outputs.titulo }}' \
              --notes-file "$corpo" \
              --prerelease
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Guardar os ZIPs como artefato
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-${{ steps.alvo.outputs.pacote }}
          path: dist/*.zip
          if-no-files-found: error
